<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061129"/>
      <stop offset="100%" stop-color="#0d1f4a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F9CF9"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="42" ry="42" fill="url(#bg)"/>

  <!-- Subtle top sheen -->
  <rect width="192" height="86" rx="42" ry="42" fill="url(#blue)" opacity="0.07"/>

  <!-- Blue accent arc (top-left glow) -->
  <circle cx="35" cy="35" r="61"
    fill="none" stroke="#2563EB" stroke-width="2" opacity="0.18"/>

  <!-- Letter L — vertical bar -->
  <rect x="46" y="35" width="27" height="109" rx="8" fill="white"/>

  <!-- Letter L — horizontal foot -->
  <rect x="46" y="117" width="100" height="27" rx="8" fill="white"/>

  <!-- Blue dot accent on top of L -->
  <circle cx="59.5" cy="29" r="5" fill="url(#blue)" filter="url(#glow)"/>

  <!-- Naira coin -->
  <circle cx="118" cy="84" r="36" fill="url(#gold)"/>
  <circle cx="118" cy="84" r="34" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>

  <!-- ₦ symbol inside coin -->
  <text x="118" y="98"
    text-anchor="middle"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-size="40"
    font-weight="900"
    fill="#78350f">₦</text>

  <!-- Thin blue border on whole icon -->
  <rect width="192" height="192" rx="42" ry="42"
    fill="none" stroke="#2563EB" stroke-width="2" opacity="0.4"/>
</svg>