<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061129"/>
      <stop offset="100%" stop-color="#0d1f4a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F9CF9"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="13" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="113" ry="113" fill="url(#bg)"/>

  <!-- Subtle top sheen -->
  <rect width="512" height="230" rx="113" ry="113" fill="url(#blue)" opacity="0.07"/>

  <!-- Blue accent arc (top-left glow) -->
  <circle cx="92" cy="92" r="164"
    fill="none" stroke="#2563EB" stroke-width="6" opacity="0.18"/>

  <!-- Letter L — vertical bar -->
  <rect x="123" y="92" width="72" height="292" rx="22" fill="white"/>

  <!-- Letter L — horizontal foot -->
  <rect x="123" y="312" width="266" height="72" rx="22" fill="white"/>

  <!-- Blue dot accent on top of L -->
  <circle cx="159" cy="77" r="13" fill="url(#blue)" filter="url(#glow)"/>

  <!-- Naira coin -->
  <circle cx="315" cy="225" r="95" fill="url(#gold)"/>
  <circle cx="315" cy="225" r="89" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="6"/>

  <!-- ₦ symbol inside coin -->
  <text x="315" y="264"
    text-anchor="middle"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-size="108"
    font-weight="900"
    fill="#78350f">₦</text>

  <!-- Thin blue border on whole icon -->
  <rect width="512" height="512" rx="113" ry="113"
    fill="none" stroke="#2563EB" stroke-width="4" opacity="0.4"/>
</svg>